[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mrds"
version = "0.1.0"
description = "Model Regression Detection System — eval, compare, and gate classical ML and LLM models"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.0",
  "pydantic-settings>=2.0",
  "pyyaml>=6.0",
  "typer>=0.12",
  "rich>=13.0",
  "sqlalchemy>=2.0",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pandas>=2.0",
  "numpy>=1.26",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
]

[project.scripts]
mrds = "mrds.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["mrds"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
